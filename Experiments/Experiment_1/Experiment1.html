<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JavaScript Experiment 1</title>

<style>

body{
    margin:0;
    padding:30px;
    background:#f5f5f5;
    font-family:Arial, Helvetica, sans-serif;
}

h1{
    text-align:center;
    color:#333;
    margin-bottom:35px;
}

.container{
    width:70%;
    margin:auto;
}

.card{

    background:#b39ddb;

    color:white;

    text-align:center;

    padding:25px;

    margin-bottom:25px;

    border-radius:10px;

    box-shadow:0 3px 8px rgba(0,0,0,0.2);

    transition:0.3s;
}

.card:hover{

    transform:translateY(-3px);
}

.card h2{

    margin-bottom:15px;
}

.card p{

    margin:8px;
    font-size:16px;
}

button{

    margin-top:15px;

    padding:10px 20px;

    border:none;

    border-radius:5px;

    background:white;

    color:#6a1b9a;

    cursor:pointer;

    font-weight:bold;
}

button:hover{

    background:#eeeeee;
}

.footer{

    text-align:center;

    margin-top:25px;

    color:#666;

    font-size:14px;
}

</style>

</head>

<body>

<h1>JavaScript Experiment - 1</h1>

<div class="container">


    <div class="card">

        <h2>Welcome to Inline JavaScript</h2>

        <p><strong>Name :</strong> INSIYA HUSSAIN</p>

        <p><strong>PRN :</strong> 24070521156 </p>

        <button onclick="alert('Welcome to Inline JavaScript!')">
            Click Here
        </button>

    </div>


    <div class="card">

        <h2>Welcome to Internal JavaScript</h2>

        <p><strong>Name :</strong> INSIYA HUSSAIN</p>

        <p><strong>PRN :</strong> 24070521156 </p>

        <button onclick="internalJS()">
            Click Here
        </button>

    </div>


    <div class="card">

        <h2>Welcome to External JavaScript</h2>

        <p><strong>Name :</strong> INSIYA HUSSAIN</p>

        <p><strong>PRN :</strong> 24070521156 </p>

        <button onclick="externalJS()">
            Click Here
        </button>

    </div>

</div>

<div class="footer">
JavaScript Lab Experiment 1
</div>

<script>

// Console Methods

console.log("Console Log Example");
console.info("Console Info Example");
console.warn("Console Warning Example");
console.error("Console Error Example");

// Internal JavaScript

function internalJS(){

    alert("Welcome to Internal JavaScript!");

}

// External JavaScript

function externalJS(){

    alert("Welcome to External JavaScript!");

}

</script>

</body>
</html>
