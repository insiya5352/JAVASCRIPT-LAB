<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gym Admission Form</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }


        .container {
            width: 750px;
            max-width: 100%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.2);
        }


        /* HEADER */

        .header {
            text-align: center;

            margin-bottom: 30px;
        }


        .header h1 {
            color: #333;

            font-size: 34px;

            margin-bottom: 8px;
        }


        .header p {
            color: #777;

            font-size: 15px;
        }


        /* FORM */

        .form-row {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 20px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group.full {
            grid-column: 1 / -1;
        }


        label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-weight: bold;

            font-size: 14px;
        }


        .required {
            color: red;
        }


        input,
        select,
        textarea {
            width: 100%;

            padding: 12px 14px;

            border: 2px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }


        input:focus,
        select:focus,
        textarea:focus {
            border-color: #667eea;
        }


        textarea {
            resize: vertical;

            min-height: 90px;
        }


        /* VALIDATION */

        input.valid,
        select.valid,
        textarea.valid {
            border-color: #28a745;
        }


        input.invalid,
        select.invalid,
        textarea.invalid {
            border-color: #dc3545;
        }


        .error {
            display: block;

            color: #dc3545;

            font-size: 12px;

            margin-top: 5px;

            min-height: 15px;
        }


        .success {
            color: #28a745;

            font-size: 12px;

            margin-top: 5px;
        }


        /* RADIO BUTTONS */

        .radio-group {
            display: flex;

            gap: 25px;

            margin-top: 8px;
        }


        .radio-option {
            display: flex;

            align-items: center;

            gap: 6px;

            font-weight: normal;

            cursor: pointer;
        }


        .radio-option input {
            width: auto;

            cursor: pointer;
        }


        /* PASSWORD STRENGTH */

        .strength-container {
            margin-top: 7px;
        }


        .strength-bar {
            width: 100%;

            height: 6px;

            background: #eee;

            border-radius: 10px;

            overflow: hidden;
        }


        #strength {
            width: 0%;

            height: 100%;

            transition: 0.3s;
        }


        #strengthText {
            font-size: 12px;

            margin-top: 4px;

            color: #777;
        }


        /* CHARACTER COUNTER */

        .character-count {
            text-align: right;

            font-size: 11px;

            color: #888;

            margin-top: 4px;
        }


        /* CHECKBOX */

        .terms {
            display: flex;

            align-items: center;

            gap: 8px;

            margin: 10px 0 20px;
        }


        .terms input {
            width: auto;
        }


        .terms label {
            margin: 0;

            font-weight: normal;
        }


        /* BUTTONS */

        .buttons {
            display: flex;

            gap: 12px;
        }


        button {
            flex: 1;

            padding: 14px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        #submitBtn {
            background: #667eea;

            color: white;
        }


        #submitBtn:hover {
            background: #5368d8;
        }


        #resetBtn {
            background: #eee;

            color: #555;
        }


        #resetBtn:hover {
            background: #ddd;
        }


        /* SUCCESS MESSAGE */

        #successMessage {
            display: none;

            background: #d4edda;

            color: #155724;

            padding: 15px;

            border-radius: 8px;

            margin-top: 20px;

            text-align: center;

            font-size: 15px;
        }


        /* RESPONSIVE */

        @media (max-width: 600px) {

            .container {
                padding: 25px;
            }


            .form-row {
                grid-template-columns: 1fr;
            }


            .form-group.full {
                grid-column: auto;
            }


            .radio-group {
                flex-direction: column;

                gap: 10px;
            }


            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- HEADER -->

        <div class="header">

            <h1>🏋️ Gym Admission</h1>

            <p>
                Join today and start your fitness journey!
            </p>

        </div>



        <!-- FORM -->

        <form id="gymForm" novalidate>


            <div class="form-row">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >

                    <span
                        id="nameError"
                        class="error">
                    </span>

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email
                        <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                    >

                    <span
                        id="emailError"
                        class="error">
                    </span>

                </div>



                <!-- PHONE -->

                <div class="form-group">

                    <label>
                        Phone Number
                        <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="10-digit mobile number"
                        maxlength="10"
                    >

                    <span
                        id="phoneError"
                        class="error">
                    </span>

                </div>



                <!-- AGE -->

                <div class="form-group">

                    <label>
                        Age
                        <span class="required">*</span>
                    </label>

                    <input
                        type="number"
                        id="age"
                        placeholder="Enter your age"
                        min="16"
                        max="70"
                    >

                    <span
                        id="ageError"
                        class="error">
                    </span>

                </div>



                <!-- GENDER -->

                <div class="form-group">

                    <label>
                        Gender
                        <span class="required">*</span>
                    </label>


                    <div class="radio-group">

                        <label class="radio-option">

                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                            >

                            Male

                        </label>


                        <label class="radio-option">

                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >

                            Female

                        </label>


                        <label class="radio-option">

                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                            >

                            Other

                        </label>

                    </div>


                    <span
                        id="genderError"
                        class="error">
                    </span>

                </div>



                <!-- MEMBERSHIP -->

                <div class="form-group">

                    <label>
                        Membership Plan
                        <span class="required">*</span>
                    </label>

                    <select id="membership">

                        <option value="">
                            Select a plan
                        </option>

                        <option value="Monthly">
                            Monthly - ₹1,500
                        </option>

                        <option value="Quarterly">
                            Quarterly - ₹4,000
                        </option>

                        <option value="Yearly">
                            Yearly - ₹12,000
                        </option>

                    </select>

                    <span
                        id="membershipError"
                        class="error">
                    </span>

                </div>



                <!-- FITNESS GOAL -->

                <div class="form-group">

                    <label>
                        Fitness Goal
                        <span class="required">*</span>
                    </label>

                    <select id="goal">

                        <option value="">
                            Select your goal
                        </option>

                        <option value="Weight Loss">
                            Weight Loss
                        </option>

                        <option value="Muscle Gain">
                            Muscle Gain
                        </option>

                        <option value="Fitness">
                            General Fitness
                        </option>

                        <option value="Strength">
                            Strength Training
                        </option>

                    </select>

                    <span
                        id="goalError"
                        class="error">
                    </span>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label>
                        Password
                        <span class="required">*</span>
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                    >

                    <div class="strength-container">

                        <div class="strength-bar">

                            <div id="strength"></div>

                        </div>

                        <p id="strengthText">
                            Password strength
                        </p>

                    </div>

                    <span
                        id="passwordError"
                        class="error">
                    </span>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label>
                        Confirm Password
                        <span class="required">*</span>
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter password"
                    >

                    <span
                        id="confirmPasswordError"
                        class="error">
                    </span>

                </div>



                <!-- ADDRESS -->

                <div class="form-group full">

                    <label>
                        Address
                        <span class="required">*</span>
                    </label>

                    <textarea
                        id="address"
                        maxlength="200"
                        placeholder="Enter your address">
                    </textarea>

                    <div class="character-count">

                        <span id="charCount">
                            0
                        </span>
                        / 200 characters

                    </div>

                    <span
                        id="addressError"
                        class="error">
                    </span>

                </div>

            </div>



            <!-- TERMS -->

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                >

                <label for="terms">

                    I agree to the gym terms and conditions.

                </label>

            </div>


            <span
                id="termsError"
                class="error">
            </span>



            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    id="submitBtn">

                    Submit Application

                </button>


                <button
                    type="reset"
                    id="resetBtn">

                    Reset

                </button>

            </div>



            <!-- SUCCESS MESSAGE -->

            <div id="successMessage">

                🎉 Registration successful!
                Welcome to our gym.

            </div>


        </form>

    </div>



    <script>

        const form =
            document.getElementById("gymForm");

        const nameInput =
            document.getElementById("name");

        const emailInput =
            document.getElementById("email");

        const phoneInput =
            document.getElementById("phone");

        const ageInput =
            document.getElementById("age");

        const membershipInput =
            document.getElementById("membership");

        const goalInput =
            document.getElementById("goal");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const addressInput =
            document.getElementById("address");

        const termsInput =
            document.getElementById("terms");

        const successMessage =
            document.getElementById("successMessage");

        const charCount =
            document.getElementById("charCount");

        const strength =
            document.getElementById("strength");

        const strengthText =
            document.getElementById("strengthText");

        function validateName() {

            const value =
                nameInput.value.trim();

            const error =
                document.getElementById("nameError");


            if (value === "") {

                error.textContent =
                    "Name is required.";

                nameInput.classList.add("invalid");
                nameInput.classList.remove("valid");

                return false;
            }


            if (value.length < 3) {

                error.textContent =
                    "Name must contain at least 3 characters.";

                nameInput.classList.add("invalid");
                nameInput.classList.remove("valid");

                return false;
            }


            if (!/^[A-Za-z ]+$/.test(value)) {

                error.textContent =
                    "Name can contain only letters.";

                nameInput.classList.add("invalid");
                nameInput.classList.remove("valid");

                return false;
            }


            error.textContent = "";

            nameInput.classList.remove("invalid");
            nameInput.classList.add("valid");

            return true;
        }


        function validateEmail() {

            const value =
                emailInput.value.trim();

            const error =
                document.getElementById("emailError");


            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            if (value === "") {

                error.textContent =
                    "Email is required.";

                emailInput.classList.add("invalid");
                emailInput.classList.remove("valid");

                return false;
            }


            if (!emailPattern.test(value)) {

                error.textContent =
                    "Enter a valid email address.";

                emailInput.classList.add("invalid");
                emailInput.classList.remove("valid");

                return false;
            }


            error.textContent = "";

            emailInput.classList.remove("invalid");
            emailInput.classList.add("valid");

            return true;
        }


        function validatePhone() {

            const value =
                phoneInput.value.trim();

            const error =
                document.getElementById("phoneError");


            if (value === "") {

                error.textContent =
                    "Phone number is required.";

                phoneInput.classList.add("invalid");
                phoneInput.classList.remove("valid");

                return false;
            }


            if (!/^[6-9][0-9]{9}$/.test(value)) {

                error.textContent =
                    "Enter a valid 10-digit phone number.";

                phoneInput.classList.add("invalid");
                phoneInput.classList.remove("valid");

                return false;
            }


            error.textContent = "";

            phoneInput.classList.remove("invalid");
            phoneInput.classList.add("valid");

            return true;
        }

        function validateAge() {

            const value =
                Number(ageInput.value);

            const error =
                document.getElementById("ageError");


            if (ageInput.value === "") {

                error.textContent =
                    "Age is required.";

                ageInput.classList.add("invalid");
                ageInput.classList.remove("valid");

                return false;
            }


            if (value < 16 || value > 70) {

                error.textContent =
                    "Age must be between 16 and 70.";

                ageInput.classList.add("invalid");
                ageInput.classList.remove("valid");

                return false;
            }


            error.textContent = "";

            ageInput.classList.remove("invalid");
            ageInput.classList.add("valid");

            return true;
        }

        function validateGender() {

            const gender =
                document.querySelector(
                    'input[name="gender"]:checked'
                );

            const error =
                document.getElementById("genderError");


            if (!gender) {

                error.textContent =
                    "Please select your gender.";

                return false;
            }


            error.textContent = "";

            return true;
        }

        function validateMembership() {

            const error =
                document.getElementById(
                    "membershipError"
                );


            if (membershipInput.value === "") {

                error.textContent =
                    "Please select a membership plan.";

                membershipInput.classList.add("invalid");
                membershipInput.classList.remove("valid");

                return false;
            }


            error.textContent = "";

            membershipInput.classList.remove("invalid");
            membershipInput.classList.add("valid");

            return true;
        }

        function validateGoal() {

            const error =
                document.getElementById("goalError");


            if (goalInput.value === "") {

                error.textContent =
                    "Please select your fitness goal.";

                goalInput.classList.add("invalid");
                goalInput.classList.remove("valid");

                return false;
            }


            error.textContent = "";

            goalInput.classList.remove("invalid");
            goalInput.classList.add("valid");

            return true;
        }


        function validatePassword() {

            const value =
                passwordInput.value;

            const error =
                document.getElementById(
                    "passwordError"
                );


            if (value === "") {

                error.textContent =
                    "Password is required.";

                passwordInput.classList.add("invalid");
                passwordInput.classList.remove("valid");

                return false;
            }


            if (value.length < 8) {

                error.textContent =
                    "Password must contain at least 8 characters.";

                passwordInput.classList.add("invalid");
                passwordInput.classList.remove("valid");

                return false;
            }


            error.textContent = "";

            passwordInput.classList.remove("invalid");
            passwordInput.classList.add("valid");

            return true;
        }

        passwordInput.addEventListener(
            "input",
            function() {

                const value =
                    passwordInput.value;

                let score = 0;


                if (value.length >= 8) {
                    score++;
                }

                if (/[A-Z]/.test(value)) {
                    score++;
                }

                if (/[0-9]/.test(value)) {
                    score++;
                }

                if (/[^A-Za-z0-9]/.test(value)) {
                    score++;
                }


                if (value.length === 0) {

                    strength.style.width = "0%";

                    strengthText.textContent =
                        "Password strength";

                }

                else if (score <= 1) {

                    strength.style.width = "25%";

                    strengthText.textContent =
                        "Weak password";

                }

                else if (score === 2) {

                    strength.style.width = "50%";

                    strengthText.textContent =
                        "Medium password";

                }

                else if (score === 3) {

                    strength.style.width = "75%";

                    strengthText.textContent =
                        "Good password";

                }

                else {

                    strength.style.width = "100%";

                    strengthText.textContent =
                        "Strong password";

                }

            }
        );

        function validateConfirmPassword() {

            const error =
                document.getElementById(
                    "confirmPasswordError"
                );


            if (confirmPasswordInput.value === "") {

                error.textContent =
                    "Please confirm your password.";

                confirmPasswordInput.classList.add("invalid");
                confirmPasswordInput.classList.remove("valid");

                return false;
            }


            if (
                confirmPasswordInput.value !==
                passwordInput.value
            ) {

                error.textContent =
                    "Passwords do not match.";

                confirmPasswordInput.classList.add("invalid");
                confirmPasswordInput.classList.remove("valid");

                return false;
            }


            error.textContent = "";

            confirmPasswordInput.classList.remove("invalid");
            confirmPasswordInput.classList.add("valid");

            return true;
        }


        function validateAddress() {

            const value =
                addressInput.value.trim();

            const error =
                document.getElementById(
                    "addressError"
                );


            if (value === "") {

                error.textContent =
                    "Address is required.";

                addressInput.classList.add("invalid");
                addressInput.classList.remove("valid");

                return false;
            }


            if (value.length < 10) {

                error.textContent =
                    "Address must contain at least 10 characters.";

                addressInput.classList.add("invalid");
                addressInput.classList.remove("valid");

                return false;
            }


            error.textContent = "";

            addressInput.classList.remove("invalid");
            addressInput.classList.add("valid");

            return true;
        }

        addressInput.addEventListener(
            "input",
            function() {

                charCount.textContent =
                    addressInput.value.length;

            }
        );


        function validateTerms() {

            const error =
                document.getElementById(
                    "termsError"
                );


            if (!termsInput.checked) {

                error.textContent =
                    "You must accept the terms and conditions.";

                return false;
            }


            error.textContent = "";

            return true;
        }

        nameInput.addEventListener(
            "input",
            validateName
        );

        emailInput.addEventListener(
            "input",
            validateEmail
        );

        phoneInput.addEventListener(
            "input",
            validatePhone
        );

        ageInput.addEventListener(
            "input",
            validateAge
        );

        membershipInput.addEventListener(
            "change",
            validateMembership
        );

        goalInput.addEventListener(
            "change",
            validateGoal
        );

        confirmPasswordInput.addEventListener(
            "input",
            validateConfirmPassword
        );

        addressInput.addEventListener(
            "input",
            validateAddress
        );

        termsInput.addEventListener(
            "change",
            validateTerms
        );

        form.addEventListener(
            "submit",
            function(event) {

                // Prevent actual form submission
                event.preventDefault();


                // Validate every field

                const validName =
                    validateName();

                const validEmail =
                    validateEmail();

                const validPhone =
                    validatePhone();

                const validAge =
                    validateAge();

                const validGender =
                    validateGender();

                const validMembership =
                    validateMembership();

                const validGoal =
                    validateGoal();

                const validPassword =
                    validatePassword();

                const validConfirmPassword =
                    validateConfirmPassword();

                const validAddress =
                    validateAddress();

                const validTerms =
                    validateTerms();


                // Check all validations

                if (
                    validName &&
                    validEmail &&
                    validPhone &&
                    validAge &&
                    validGender &&
                    validMembership &&
                    validGoal &&
                    validPassword &&
                    validConfirmPassword &&
                    validAddress &&
                    validTerms
                ) {

                    successMessage.style.display =
                        "block";

                    successMessage.textContent =
                        "🎉 Registration successful! Welcome to our gym.";

                    // Scroll to success message
                    successMessage.scrollIntoView({
                        behavior: "smooth"
                    });

                } else {

                    successMessage.style.display =
                        "none";

                }

            }
        );


        form.addEventListener(
            "reset",
            function() {

                setTimeout(function() {


                    const fields =
                        form.querySelectorAll(
                            "input, select, textarea"
                        );


                    fields.forEach(
                        function(field) {

                            field.classList.remove(
                                "valid",
                                "invalid"
                            );

                        }
                    );


                    const errors =
                        form.querySelectorAll(
                            ".error"
                        );


                    errors.forEach(
                        function(error) {

                            error.textContent = "";

                        }
                    );


                    charCount.textContent = "0";

                    strength.style.width = "0%";

                    strengthText.textContent =
                        "Password strength";


                    successMessage.style.display =
                        "none";

                }, 0);

            }
        );

    </script>

</body>

</html>
